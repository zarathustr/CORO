[project]
name = "deep-coro-znn-parallel"
version = "0.1.0"
description = "Corrected Zhang-neural-network + CORO calibration solvers"
requires-python = ">=3.9,<3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
]
