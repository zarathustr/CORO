[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-coro-opencl"
version = "0.1.0"
description = "OpenCL inference operator and reference implementation for Deep CORO on SO(3)."
requires-python = ">=3.9,<3.13"
dependencies = ["numpy>=1.21", "pandas>=1.3", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["deep_coro_opencl*"]

[tool.setuptools.package-data]
deep_coro_opencl = ["kernels/*.cl"]
